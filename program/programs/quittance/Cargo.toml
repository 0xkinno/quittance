[package]
name = "quittance"
version = "0.1.0"
description = "A rotating savings circle whose payout cannot run twice and cannot run while any contribution is unresolved."
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "quittance"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# `init-if-needed` is enabled deliberately. Two accounts are created by the
# instruction that first writes to them — `Membership` and `ContributionSlot` —
# because splitting creation from the write would leave a window in which a
# slot exists with no recorded state.
#
# Anchor gates this feature because of re-initialization attacks, and the
# protection here is explicit rather than incidental: both accounts are PDAs
# whose addresses the caller cannot choose, and both carry a boolean written on
# first use (`Membership.accepted`, `ContributionSlot.recorded`) that every
# handler checks before writing. A second call finds the flag set and fails
# with a message a person can read, instead of an opaque "account already in
# use" from the system program.
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"

